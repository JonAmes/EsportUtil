<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locate Overlay — LAN-PC-02</title>
<style>
  :root{
    --fg: var(--foreground, #e6e6ea);
    --mut: var(--muted-foreground, #9b9ba6);
    --acc: var(--accent, #6d8dff);
    --bg:  var(--card, #0d0f14);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; font-family: var(--app-font, ui-sans-serif, system-ui, "Segoe UI", sans-serif); color:var(--fg); }
  .screen{
    position:relative; width:100%; aspect-ratio:16/9; background:var(--bg);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  /* faint wallpaper hint under the dim layer */
  .wallpaper{ position:absolute; inset:0; background:
      radial-gradient(120% 90% at 20% 10%, #16233d 0%, #0d0f14 55%),
      radial-gradient(80% 70% at 85% 90%, #1b1430 0%, transparent 60%); }
  .dim{ position:absolute; inset:0; background:rgba(6,8,12,.78); }
  /* pulsing accent border — the "you found me" cue */
  .border{ position:absolute; inset:14px; border:4px solid var(--acc); border-radius:14px;
           animation:pulse 1.15s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.35; box-shadow:0 0 0 0 rgba(109,141,255,0);}
                    50%{ opacity:1; box-shadow:0 0 42px 4px rgba(109,141,255,.35);} }
  .card{ position:relative; display:flex; align-items:center; gap:44px; padding:10px 24px; }
  .idblock{ display:flex; flex-direction:column; gap:10px; }
  .kicker{ font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--acc); font-weight:700; }
  .name{ font-size:clamp(34px,7.5vw,76px); font-weight:800; letter-spacing:-.02em; line-height:1; white-space:nowrap; }
  .meta{ font-size:15px; color:var(--mut); white-space:nowrap; }
  .meta b{ color:var(--fg); font-weight:600; }
  .qrwrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .qr{ width:118px; height:118px; border-radius:10px; background:#fff; padding:10px;
       display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr); gap:2px; }
  .qr i{ background:#111; border-radius:1px; }
  .qr i.off{ background:transparent; }
  .qrlabel{ font-size:12px; color:var(--mut); }
  .count{ position:absolute; top:30px; right:36px; font-variant-numeric:tabular-nums;
          font-size:20px; font-weight:700; color:var(--acc); }
  .count small{ display:block; font-size:11px; font-weight:500; color:var(--mut); text-align:right; }
  .dismiss{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
            font-size:12px; color:var(--mut); }
</style>
</head>
<body>
  <div class="screen">
    <div class="wallpaper"></div>
    <div class="dim"></div>
    <div class="border"></div>
    <div class="count"><span id="n">30</span>s<small>auto-dismiss</small></div>
    <div class="card">
      <div class="idblock">
        <div class="kicker">Locate — this machine</div>
        <div class="name">LAN-PC-02</div>
        <div class="meta">PIN <b>7734</b> · Back row, station 6 · <b>Aurora R12</b> · agent v0.1.0</div>
      </div>
      <div class="qrwrap">
        <div class="qr" id="qr"></div>
        <div class="qrlabel">scan = device identity (same payload as label)</div>
      </div>
    </div>
    <div class="dismiss">click anywhere or press ESC to dismiss</div>
  </div>
<script>
  // pseudo-QR: deterministic block pattern from the PIN so it looks scannable-ish
  const qr = document.getElementById('qr'), seed = "7734";
  let h = 0; for (const c of seed) h = (h*31 + c.charCodeAt(0)) >>> 0;
  for (let r=0;r<9;r++) for (let c=0;c<9;c++){
    const corner = (r<3&&c<3)||(r<3&&c>5)||(r>5&&c<3);
    h = (h*1103515245 + 12345) >>> 0;
    const on = corner ? !(r===1&&c===1||r===1&&c===7||(r===7&&c===1)) : (h&1);
    const i = document.createElement('i'); if(!on) i.className='off'; qr.appendChild(i);
  }
  // live countdown; at 0 the overlay "closes" (mock: border stops pulsing)
  let t = 30; const n = document.getElementById('n');
  const iv = setInterval(()=>{ if(t>0){ t--; n.textContent=t; }
    if(t===0){ clearInterval(iv); document.querySelector('.border').style.animation='none';
               document.querySelector('.border').style.opacity=.25; } }, 1000);
</script>
</body>
</html>
