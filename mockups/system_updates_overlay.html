<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Update Overlay Mockup</title>
    <style>
        /* --- Light/White Theme Variables --- */
        :root{
            --fg: #111111; /* Dark foreground text */
            --mut: #666666; /* Muted text */
            --acc: #007bff; /* Blue accent for updates */
            --bg:  #f0f0f0; /* Light background */
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        html,body{ height:100%; font-family: Arial, sans-serif; color:var(--fg); }
        .screen {
            position:relative; 
            width:100%; 
            height:100%; 
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            justify-content:center; /* Center content instead of space-between */
            overflow:hidden;
            background:var(--bg);
        }
        /* Dimming layer (Subtle white tint if needed, but keeping it light) */
        .dim{ 
            position:absolute; 
            inset:0; 
            background:rgba(255, 255, 255, 0.1); /* Very slight white tint */
            z-index: 1;
        }
        /* Pulsing accent border — the "update required" cue */
        .border{ 
            position:absolute; 
            inset:14px; 
            border:4px solid var(--acc); 
            border-radius:14px;
            animation:pulse 1.5s ease-in-out infinite alternate;
            z-index: 2;
        }
        @keyframes pulse{ 
            0%,100%{ opacity:.1; box-shadow:0 0 0 0 rgba(0,123,255,.1);}
            50%{ opacity:1; box-shadow:0 0 60px 5px rgba(0,123,255,.5);}
        }
        /* Main Content Card - Styled for updates */
        .card{ 
            position:relative; 
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            text-align:center;
            padding:50px; 
            background-color: white; /* Solid white content box */
            border-radius:15px;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.3); /* Soft blue shadow */
            width: 80%;
            max-width: 600px;
            margin-top: 100px; /* More padding at the top for light theme centering */
            z-index: 3; 
        }
        .overlay-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            color: var(--acc); /* Use accent color for icon */
        }
        h1 {
            margin: 0;
            text-transform: uppercase;
            font-size: 50px;
        }
        p {
            margin-top: 10px;
            font-size: 24px;
            line-height: 1.3;
            text-align: center;
        }
        /* New Progress Bar Styles */
        .progress-container {
            width: 90%;
            height: 30px;
            background-color: #ddd;
            border-radius: 15px;
            margin: 25px auto;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--acc);
            width: 35%; /* Set initial progress to 35% for mockup */
            transition: width 0.4s ease;
        }
        /* Footer message fixed at the bottom */
        .footer-message {
            text-align: center; 
            padding: 10px;
            font-size: 16px;
            color: var(--mut);
            width: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0); 
            z-index: 4;
        }
    </style>
</head>
<body class="screen">
    <div class="dim"></div>
    <div class="border"></div>
    <div class="card">
        <span class="overlay-icon">⬆️</span>
        <h1>System Updates In Progress</h1>
        <p>The system is currently updating. Please wait for the progress bar to complete.</p>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>
    <div class="footer-message">
        <!-- Footer text removed as requested -->
    </div>
</body>
</html>
