<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Downed Overlay Mockup</title>
    <style>
        :root{
            /* Red/Warning Color Palette */
            --fg: var(--foreground, #e6e6ea);
            --mut: var(--muted-foreground, #9b9ba6);
            --acc: var(--accent, #ff0000); /* Red accent */
            --bg:  var(--card, #280505); /* Dark red/brown background */
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        html,body{ height:100%; font-family: Arial, sans-serif; color:var(--fg); }
        .screen {
            position:relative; 
            width:100%; 
            height:100%; 
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            justify-content:space-between; /* Push content up and footer down */
            overflow:hidden;
            background:var(--bg);
        }
        /* Dimming layer (Red tint) */
        .dim{ 
            position:absolute; 
            inset:0; 
            background:rgba(139,0,0,.8); /* Deep, translucent red tint */
            z-index: 1;
        }
        /* Pulsing border */
        .border{ 
            position:absolute; 
            inset:14px; 
            border:5px solid var(--acc); 
            border-radius:14px;
            animation:pulse 1.5s ease-in-out infinite alternate;
            z-index: 2;
        }
        @keyframes pulse{ 
            0%,100%{ opacity:.3; box-shadow:0 0 0 0 rgba(255,0,0,.2);}
            50%{ opacity:1; box-shadow:0 0 60px 5px rgba(255,0,0,.8);}
        }
        /* Main Content Card */
        .card{ 
            position:relative; 
            display:flex; 
            flex-direction:column; 
            align-items:center; 
            text-align:center;
            padding:50px; 
            background-color: rgba(128, 0, 0, 0.95); /* Deep solid red content box */
            border-radius:15px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 1);
            width: 80%;
            max-width: 600px;
            margin-top: 50px; /* Space from top edge */
            z-index: 3; /* Above dim layer */
        }
        .overlay-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            color: #ffd700; /* Yellow for high contrast warning */
        }
        h1 {
            margin: 0;
            text-transform: uppercase;
            font-size: 50px;
        }
        p {
            margin-top: 10px;
            font-size: 24px;
            line-height: 1.3;
            text-align: center;
        }
        /* Footer message fixed at the bottom */
        .footer-message {
            text-align: center; 
            padding: 10px;
            font-size: 16px;
            color: var(--mut);
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0); /* Transparent background */
            z-index: 4;
        }
    </style>
</head>
<body class="screen">
    <div class="dim"></div>
    <div class="border"></div>
    <div class="card">
        <span class="overlay-icon">🔴</span>
        <h1>Out of Order</h1>
        <p>System services are out of order due to: [Reason Placeholder].</p>
    </div>
    <div class="footer-message">
        Please see the person at the front desk for further instruction.
    </div>
</body>
</html>
